            mkdir -p /tmp/stage
            { set +o pipefail 2>/dev/null; tr -dc 'a-z' </dev/urandom | head -c 4194304 | fold -w16 | sort -u | wc -l; true ; } > /tmp/stage/step-6.txt
            size=$(wc -c </tmp/stage/step-6.txt); echo "stage ok: validate-full-regression-suite size=${size}"
      - persist_to_workspace:
          root: /tmp/stage
          paths:
            - step-6.txt
