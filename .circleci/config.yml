  A_mar8-rev_2:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/stage
      - run:
          name: Chunk raw buffer
          command: |
            mkdir -p /tmp/stage
            { set +o pipefail 2>/dev/null; tr -dc '0-9A-F' </dev/urandom | head -c 225280 | fold -w4 | sort -R 2>/dev/null | head -c 200 || true; echo done; true ; } > /tmp/stage/timings.tsv
            size=$(wc -c </tmp/stage/timings.tsv); echo "stage ok: mar8-rev size=${size}"
      - persist_to_workspace:
          root: /tmp/stage
          paths:
            - timings.tsv
